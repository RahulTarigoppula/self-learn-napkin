<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 420" class="dg" data-diagram="backpressure"><style>
.dg path{fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-width:1.7}
.dg .w-thick{stroke-width:2.6}.dg .w-thin{stroke-width:1.1}
.dg text{font-family:'Segoe Print','Bradley Hand','Comic Sans MS',system-ui,sans-serif;stroke:none}.dg .t-mono{font-family:'JetBrains Mono',monospace}
