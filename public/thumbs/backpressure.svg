</style><g><path d="M15 54 L123 54 L122 111 L16 112" class="f-blue"/><path d="M15 52 C56 55, 94 52, 126 52 M122 52 C124 69, 123 80, 123 112 M124 110 C81 111, 36 111, 18 112 M18 108 C15 91, 17 67, 15 54" class="s-blue"/><text x="70" y="72" font-size="16" text-anchor="middle" dominant-baseline="central" class="t t-blue t-bold">producer</text><text x="70" y="94" font-size="15" text-anchor="middle" dominant-baseline="central" class="t t-blue t-mono">1,000 / s</text></g><g><path d="M170 62 C222 63, 275 64, 350 63 M348 63 C350 76, 352 91, 348 100 M350 102 C304 102, 260 104, 171 102 M172 100 C171 89, 169 79, 171 61" class="s-violet w-thick"/><path d="M200 68 C202 79, 201 89, 200 100" class="s-violet w-thin"/><path d="M228 67 C229 76, 231 86, 228 98" class="s-violet w-thin"/><path d="M261 66 C261 77, 261 83, 262 97" class="s-violet w-thin"/><path d="M291 67 C288 76, 289 85, 288 100" class="s-violet w-thin"/><path d="M319 66 C320 73, 319 82, 322 98" class="s-violet w-thin"/><text x="216" y="118" font-size="15" text-anchor="middle" dominant-baseline="central" class="t t-muted">buffer</text></g><g><path d="M397 54 L504 55 L503 110 L394 110" class="f-green"/><path d="M395 56 C436 52, 477 53, 503 53 M502 53 C502 71, 503 83, 504 111 M503 110 C468 110, 430 110, 396 112 M397 111 C398 95, 397 81, 397 54" class="s-green"/><text x="450" y="72" font-size="16" text-anchor="middle" dominant-baseline="central" class="t t-green t-bold">consumer</text><text x="450" y="94" font-size="15" text-anchor="middle" dominant-baseline="central" class="t t-green t-mono">800 / s</text></g><g><path d="M129 84 C137 84, 147 80, 165 82" class="s-blue w-thick"/><path d="M155 77 C156 78, 159 80, 164 82 M164 82 C162 83, 159 85, 154 87" class="s-blue w-thick"/></g><g><path d="M356 80 C368 82, 377 82, 388 81" class="s-green w-thick"/><path d="M380 77 C384 79, 388 80, 390 82 M390 83 C387 84, 384 86, 380 87" class="s-green w-thick"/></g><g><path d="M46 244 C117 243, 188 244, 239 242" class="s-muted"/><path d="M44 243 C44 212, 46 178, 43 151" class="s-muted"/><text x="44" y="138" font-size="15" text-anchor="middle" dominant-baseline="central" class="t t-muted">queued</text><text x="232" y="262" font-size="15" text-anchor="middle" dominant-baseline="central" class="t t-muted t-mono">60 s</text></g><g><path d="M44 242 C108 210, 176 182, 227 162" class="s-red w-thick"/><text x="222" y="146" font-size="15" text-anchor="middle" dominant-baseline="central" class="t t-red t-mono">12,000</text></g><g><text x="262" y="183" font-size="15" text-anchor="start" dominant-baseline="central" class="t t-red">+200/s piles up</text><text x="262" y="200" font-size="15" text-anchor="start" dominant-baseline="central" class="t t-red">wait = 12,000 ÷ 800 = 15 s</text><text x="262" y="217" font-size="15" text-anchor="start" dominant-baseline="central" class="t t-red">then: out of memory</text></g><g><path d="M176 54 C173 78, 174 98, 173 111" class="s-red w-thick"/><text x="306" y="118" font-size="15" text-anchor="middle" dominant-baseline="central" class="t t-red t-bold">cap = 100</text></g><g><path d="M14 304 L171 305 L170 354 L17 356" class="f-orange"/><path d="M15 304 C67 302, 116 304, 172 305 M174 304 C171 316, 173 330, 173 355 M173 357 C137 357, 101 354, 17 357 M17 358 C17 340, 15 328, 15 302" class="s-orange"/><text x="94" y="320" font-size="16" text-anchor="middle" dominant-baseline="central" class="t t-orange t-bold">block</text><text x="94" y="342" font-size="15" text-anchor="middle" dominant-baseline="central" class="t t-ink">producer waits</text><path d="M181 306 L338 304 L339 357 L180 358" class="f-orange"/><path d="M183 305 C216 305, 254 302, 337 302 M337 303 C339 315, 339 329, 336 356 M338 355 C289 355, 235 356, 181 356 M182 354 C180 344, 182 334, 183 302" class="s-orange"/><text x="260" y="320" font-size="16" text-anchor="middle" dominant-baseline="central" class="t t-orange t-bold">drop</text><text x="260" y="342" font-size="15" text-anchor="middle" dominant-baseline="central" class="t t-ink">oldest or newest</text><path d="M349 304 L506 304 L502 357 L346 356" class="f-orange"/><path d="M347 304 C401 305, 451 307, 506 306 M503 303 C504 322, 506 337, 502 357 M503 357 C465 357, 429 358, 348 358 M349 356 C349 336, 346 316, 346 306" class="s-orange"/><text x="426" y="320" font-size="16" text-anchor="middle" dominant-baseline="central" class="t t-orange t-bold">shed</text><text x="426" y="342" font-size="15" text-anchor="middle" dominant-baseline="central" class="t t-ink">429 / 503 early</text><text x="260" y="288" font-size="15" text-anchor="middle" dominant-baseline="central" class="t t-muted">when the buffer is full:</text></g><g><path d="M451 48 C443 47, 418 44, 402 42 C386 40, 371 37, 356 36 C340 35, 325 35, 308 35 C292 35, 275 34, 259 34 C243 33, 228 32, 213 33 C197 33, 182 35, 166 36 C150 38, 133 39, 117 42 C101 44, 79 48, 71 48" class="s-green"/><path d="M80 51 C77 51, 75 49, 70 48 M70 48 C74 46, 77 43, 78 42" class="s-green"/><text x="260" y="16" font-size="15" text-anchor="middle" dominant-baseline="central" class="t t-green">request(50): send at most 50</text></g><g><text x="260" y="380" font-size="16" text-anchor="middle" dominant-baseline="central" class="t t-violet t-bold">Little's law: L = λ × W</text></g><g><text x="260" y="402" font-size="15" text-anchor="middle" dominant-baseline="central" class="t t-violet">cap 100 at 800/s → wait ≤ 100 ÷ 800 = 125 ms</text></g></svg>
