</style><g><text x="20" y="26" font-size="18" text-anchor="start" dominant-baseline="central" class="t t-ink">def fact(n):</text><text x="44" y="50" font-size="18" text-anchor="start" dominant-baseline="central" class="t t-green">if n &lt;= 1: return 1</text><text x="44" y="74" font-size="18" text-anchor="start" dominant-baseline="central" class="t t-blue">return n * fact(n - 1)</text></g><g><text x="306" y="50" font-size="16" text-anchor="start" dominant-baseline="central" class="t t-green">← base case: stop</text></g><g><text x="306" y="74" font-size="16" text-anchor="start" dominant-baseline="central" class="t t-blue">← recursive case</text></g><g><path d="M23 405 C22 344, 21 284, 25 229" class="s-muted w-thin"/><path d="M18 237 C21 235, 21 231, 24 228 M25 228 C26 232, 28 236, 30 237" class="s-muted w-thin"/><text x="44" y="212" font-size="15" text-anchor="start" dominant-baseline="central" class="t t-muted">call stack grows upward</text></g><g><path d="M43 367 L235 366 L235 405 L44 404" class="f-blue"/><path d="M45 366 C113 365, 183 366, 234 367 M235 366 C233 378, 233 392, 234 404 M233 404 C194 404, 152 404, 45 404 M44 403 C45 390, 44 374, 45 367" class="s-blue"/><text x="139" y="385" font-size="17" text-anchor="middle" dominant-baseline="central" class="t t-blue">fact(4): 4 × ?</text></g><g><path d="M44 319 L235 320 L235 359 L44 358" class="f-blue"/><path d="M43 320 C103 319, 161 321, 235 321 M234 320 C233 330, 233 338, 234 357 M235 359 C158 357, 84 356, 43 357 M44 358 C44 348, 45 336, 45 320" class="s-blue"/><text x="139" y="339" font-size="17" text-anchor="middle" dominant-baseline="central" class="t t-blue">fact(3): 3 × ?</text></g><g><path d="M45 274 L233 273 L233 311 L45 312" class="f-blue"/><path d="M43 273 C95 275, 149 274, 233 273 M233 274 C235 288, 234 303, 235 312 M233 311 C161 313, 89 311, 45 313 M45 313 C46 301, 45 287, 43 275" class="s-blue"/><text x="139" y="293" font-size="17" text-anchor="middle" dominant-baseline="central" class="t t-blue">fact