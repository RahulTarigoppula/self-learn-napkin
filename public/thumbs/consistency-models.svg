 x="14" y="362" font-size="16" text-anchor="start" dominant-baseline="central" class="t t-ink t-bold">causal</text><text x="314" y="362" font-size="16" text-anchor="middle" dominant-baseline="central" class="t t-green t-bold">yes</text><text x="446" y="362" font-size="16" text-anchor="middle" dominant-baseline="central" class="t t-red t-bold">no</text></g><g><text x="14" y="392" font-size="16" text-anchor="start" dominant-baseline="central" class="t t-ink t-bold">eventual</text><text x="314" y="392" font-size="16" text-anchor="middle" dominant-baseline="central" class="t t-green t-bold">yes</text><text x="446" y="392" font-size="16" text-anchor="middle" dominant-baseline="central" class="t t-green t-bold">yes</text></g></svg>
