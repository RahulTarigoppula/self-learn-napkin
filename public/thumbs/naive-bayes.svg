nt-size="14" text-anchor="start" dominant-baseline="central" class="t t-red t-mono">0.4 × 7/13 × 4/13 = 0.066</text></g><g><text x="56" y="310" font-size="15" text-anchor="end" dominant-baseline="central" class="t t-blue">ham</text><path d="M65 301 L90 301 L90 319 L64 318" class="f-blue"/><path d="M65 301 C74 301, 84 301, 90 301 M90 301 C89 306, 90 310, 90 319 M90 319 C83 320, 78 319, 64 319 M63 320 C64 315, 64 311, 64 301" class="s-blue"/><text x="100" y="310" font-size="14" text-anchor="start" dominant-baseline="central" class="t t-blue t-mono">0.6 × 3/13 × 1/13 = 0.011</text></g><g><text x="500" y="334" font-size="15" text-anchor="end" dominant-baseline="central" class="t t-red t-bold">P(spam | email) = 0.066 / 0.077 = 86 %</text></g><g><text x="16" y="358" font-size="14" text-anchor="start" dominant-baseline="central" class="t t-red t-mono">ln spam = −0.92 − 0.62 − 1.18 = −2.71</text><text x="16" y="378" font-size="14" text-anchor="start" dominant-baseline="central" class="t t-blue t-mono">ln ham  = −0.51 − 1.47 − 2.56 = −4.54</text></g><g><text x="16" y="399" font-size="14" text-anchor="start" dominant-baseline="central" class="t t-muted">1,000 words: 0.001¹⁰⁰⁰ underflows to 0, but its log is just −6,908</text></g></svg>
