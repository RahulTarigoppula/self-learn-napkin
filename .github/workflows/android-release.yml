# Build a SIGNED Android APK (Capacitor) of the same app.
#  - push a tag v*   → APK attached to a GitHub Release (download it on the phone and install)
#  - push to main    → APK uploaded as a workflow artifact
# Needs four repository secrets: ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
name: android-release

on:
  push:
    tags: ['v*']
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: ${{ github.ref_type == 'tag' && github.ref_name || format('v1.0.{0}', github.run_number) }}
    steps:
      - uses: actions/checkout@v4

      - name: Check signing secrets
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KS_B64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set — see docs/DEPLOYMENT.md"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21 # Capacitor 8 targets Java 21
          cache: gradle

      - name: Build the web app (base "/" — Capacitor serves from https://localhost/)
        run: |
          npm ci
          npm run build
        env:
          VITE_BASE_PATH: /
          VITE_PLATFORM: android
          APP_VERSION: ${{ env.VERSION_NAME }}

      - name: Sync web assets and plugins into android/
        run: npx cap sync android

      - name: Decode the keystore
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: printf '%s' "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.p12"

      - name: Build the signed release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/release.p12
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleRelease \
            -PversionCode="$VERSION_CODE" -PversionName="${VERSION_NAME#v}"

      - name: Collect the output (fails loudly if the APK came out unsigned)
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk "out/napkin-${VERSION_NAME#v}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk out/napkin.apk
          (cd out && sha256sum *.apk > SHA256SUMS.txt)
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: napkin-apk-${{ env.VERSION_NAME }}
          path: out/
          retention-days: 30

      - name: Attach the APK to the GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Napkin ${{ github.ref_name }}
          generate_release_notes: true
          make_latest: true
          files: |
            out/*.apk
            out/SHA256SUMS.txt
